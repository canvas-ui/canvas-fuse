[package]
name = "canvas-fuse"
version = "0.9.2"
description = "Canvas context FUSE mount that materializes context views as folders"
authors = ["Jozef Melich <me@idnc.sk>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/canvas-ui/canvas-fuse"
edition = "2021"

[lib]
name = "canvas_fuse"
path = "src/lib.rs"

[[bin]]
name = "canvas-fuse"
path = "src/main.rs"

[dependencies]
# default-features off: skip libfuse linkage, mount via fusermount3 directly
fuser = { version = "0.15", default-features = false, features = ["abi-7-31"] }
libc = "0.2"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: JSON bodies keep the document's own field order, so a
# `.todo.json` reads the same here as it does over WebDAV (JS objects preserve
# insertion order; a BTreeMap would alphabetize every save).
serde_json = { version = "1", features = ["preserve_order"] }
rust_socketio = "0.6"
# rust_socketio/rust_engineio hardcode native-tls (no rustls feature). Rather
# than carry two TLS stacks, reqwest also uses native-tls (its default) and we
# vendor OpenSSL — compiled statically from source per target — so cross/musl/
# macOS builds need no system OpenSSL sysroot.
openssl = { version = "0.10", features = ["vendored"] }
redb = "2"
clap = { version = "4", features = ["derive", "env"] }
parking_lot = "0.12"
log = "0.4"
env_logger = "0.11"
chrono = "0.4"
ctrlc = { version = "3", features = ["termination"] }
anyhow = "1"
dirs = "5"
sha2 = "0.10"
unicode-normalization = "0.1"
glob = "0.3"

[dev-dependencies]
tempfile = "3.27.0"
tiny_http = "0.12"
